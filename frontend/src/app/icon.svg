<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Ocean Blue Dorsal Wing (Light & Speed side) -->
    <linearGradient id="oceanDorsal" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="30%" stop-color="#0EA5E9" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="92%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Deep Abyss Ventral Wing (Shadow & Dimensional depth side) -->
    <linearGradient id="oceanVentral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="40%" stop-color="#075985" />
      <stop offset="80%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <!-- Center Keel Underbody Fold (Midnight Deep Ocean Shade) -->
    <linearGradient id="oceanKeel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C4A6E" />
      <stop offset="60%" stop-color="#082F49" />
      <stop offset="100%" stop-color="#031A29" />
    </linearGradient>

    <!-- Razor Spine Specular Reflection (Brilliant White to Cyan) -->
    <linearGradient id="whiteSpine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Outer Leading Edge White Highlight -->
    <linearGradient id="leadingEdgeWhite" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Trailing Ocean Pulse Wave Gradient -->
    <linearGradient id="oceanWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Beacon Particle -->
    <radialGradient id="oceanBeacon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Core Cyan Glow -->
    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for elevation -->
    <filter id="oceanShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="-4" dy="16" stdDeviation="22" flood-color="#031A29" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Craft -->
  <circle cx="280" cy="235" r="210" fill="url(#ambientCyan)" />

  <!-- Trailing Outreach Radar Arcs (Signals radiating outward) -->
  <g opacity="0.55">
    <path d="M 86 426 A 240 240 0 0 1 426 86" fill="none" stroke="url(#oceanWave)" stroke-width="4" stroke-dasharray="10 12" />
    <path d="M 140 426 A 186 186 0 0 1 426 140" fill="none" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.5" />
    <path d="M 194 426 A 132 132 0 0 1 426 194" fill="none" stroke="#7DD3FC" stroke-width="2.5" stroke-dasharray="6 8" stroke-opacity="0.4" />
  </g>

  <!-- Vector Trajectory Line -->
  <line x1="90" y1="422" x2="444" y2="68" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" />

  <!-- Origin Beacon Pulse Core -->
  <circle cx="140" cy="372" r="54" fill="url(#oceanBeacon)" />
  <circle cx="140" cy="372" r="8" fill="#BAE6FD" />
  <circle cx="140" cy="372" r="3.5" fill="#FFFFFF" />

  <!-- Supersonic Outreach Craft in Ocean Blue and White -->
  <g filter="url(#oceanShadow)">
    <!-- Right Ventral Wing (Deep Ocean Abyss Shadow) -->
    <!-- Nose: 452,60 | Right Tip: 312,424 | Inner Notch: 272,272 -->
    <polygon points="452,60 272,272 312,424" fill="url(#oceanVentral)" />

    <!-- Isometric Keel Fin (Center body depth fold) -->
    <!-- Nose: 452,60 | Keel Notch: 196,348 | Inner Notch: 272,272 -->
    <polygon points="452,60 272,272 196,348" fill="url(#oceanKeel)" />

    <!-- Left Dorsal Wing (Main forward wing in Ocean Blue to Pure White) -->
    <!-- Nose: 452,60 | Left Tip: 88,200 | Inner Notch: 272,272 -->
    <polygon points="452,60 88,200 272,272" fill="url(#oceanDorsal)" />

    <!-- Top Aerodynamic Specular Facet (Pure White Sheen) -->
    <polygon points="452,60 180,210 88,200" fill="#FFFFFF" opacity="0.35" />

    <!-- Center Razor Spine Line (Brilliant Specular White) -->
    <line x1="452" y1="60" x2="272" y2="272" stroke="url(#whiteSpine)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Outer Leading Edges (Pure White & Cyan Highlights) -->
    <line x1="452" y1="60" x2="88" y2="200" stroke="url(#leadingEdgeWhite)" stroke-width="3.5" stroke-linecap="round" />
    <line x1="452" y1="60" x2="312" y2="424" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85" />

    <!-- Trailing Notched Back Edges -->
    <line x1="88" y1="200" x2="272" y2="272" stroke="#0284C7" stroke-opacity="0.8" stroke-width="2" />
    <line x1="312" y1="424" x2="272" y2="272" stroke="#0369A1" stroke-opacity="0.8" stroke-width="2" />
  </g>

  <!-- Apex Supersonic Flare (Pure White Specular Star) -->
  <circle cx="452" cy="60" r="6" fill="#FFFFFF" />
  <circle cx="452" cy="60" r="2.5" fill="#E0F2FE" />
</svg>